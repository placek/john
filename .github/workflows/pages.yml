# Publikacja statycznej wersji przeglądarki (browser/) na GitHub Pages.
#
# Wymaga jednorazowego włączenia w repozytorium:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Budowanie: python3 (biblioteka standardowa) — baza SQLite z data/*.json,
# złożenie PDF (typst) i eksport statyczny do site/ (tools/export_site.py).
name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      - name: Zbuduj bazę, złóż PDF i stronę statyczną
        run: |
          python3 tools/egzegeza_jana_build.py
          python3 tools/export_typst.py
          typst compile --font-path . egzegeza.typ egzegeza.pdf
          python3 tools/export_site.py
      # include-hidden-files: od v4 ta akcja wyklucza z artefaktu pliki
      # zaczynajace sie kropka, a tools/export_site.py zapisuje .nojekyll.
      # Bez tego przelacznika plik wypada po cichu i Pages wlacza Jekylla.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
